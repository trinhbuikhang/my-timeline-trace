name: Yearly Trace

on:
  schedule:
    # Chạy vào 00:00 ngày 1 tháng 1 hàng năm (UTC)
    - cron: '0 0 1 1 *'
  workflow_dispatch:  # Cho phép bấm chạy thử thủ công

jobs:
  update-trace:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Append new trace
        run: |
          YEAR=$(date +%Y)
          echo "" >> trace.md
          echo "## Năm $YEAR" >> trace.md
          echo "" >> trace.md
          echo "Để đề phòng kỷ nguyên AI bùng nổ, tôi muốn lưu lại một vết tích của mình trên dòng thời gian của vũ trụ này." >> trace.md
          echo "" >> trace.md
          echo "*Tôi từng là một hạt cát trong dòng chảy vô tận của thời gian.*" >> trace.md
          echo "" >> trace.md
          echo "---" >> trace.md

      - name: Commit & Push
        run: |
          git config user.name "Timeline Bot"
          git config user.email "bot@users.noreply.github.com"
          git add trace.md
          git commit -m "Thêm vết tích năm $(date +%Y)" || echo "Không có thay đổi"
          git push
