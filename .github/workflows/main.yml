name: 🌌 Timeline Keeper

on:
  schedule:
    - cron: '0 0 1 1 *'

  push:
    paths:
      - 'years/*.md'
      - 'scripts/build_timeline.py'
      - '.github/workflows/main.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Receive timeline
        uses: actions/checkout@v4

      - name: 🆕 Create annual capsule when needed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          YEAR="$(date -u +%Y)"
          FILE="years/${YEAR}.md"
          TEMPLATE="years/_template.md"

          if [ -f "$FILE" ]; then
            echo "${FILE} already exists. Nothing to create."
            exit 0
          fi

          test -f "$TEMPLATE"
          sed \
            -e "s/YEAR/${YEAR}/g" \
            -e "s/TEN_YEARS_LATER/$((YEAR + 10))/g" \
            "$TEMPLATE" > "$FILE"

          echo "Created ${FILE}."

      - name: 🧭 Rebuild README from capsules
        run: python scripts/build_timeline.py

      - name: 💾 Commit timeline changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Timeline is already up to date."
          else
            git config user.name "Timeline Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md years/
            git commit -m "🌌 Maintain timeline"
            git push
          fi

      - name: 👤 Sync profile README
        env:
          PROFILE_REPO_PAT: ${{ secrets.PROFILE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PROFILE_REPO_PAT:-}" ]; then
            echo "PROFILE_REPO_PAT is not configured; skipping profile sync."
            exit 0
          fi

          git clone --depth 1 "https://x-access-token:${PROFILE_REPO_PAT}@github.com/trinhbuikhang/trinhbuikhang.git" profile
          cp README.md profile/TIMELINE.md

          python - <<'PY'
          from pathlib import Path

          timeline = Path("profile/TIMELINE.md").read_text(encoding="utf-8")
          profile_readme = f'''# 🌌 MY TIMELINE TRACE

> *A living archive of one human life, carried forward year by year.*

This profile is automatically synchronized from **[my-timeline-trace](https://github.com/trinhbuikhang/my-timeline-trace)**.

The machine keeps the clock. **The human provides the meaning.**

---

{timeline}

---

*Synced automatically · Started in 2026*
'''
          Path("profile/README.md").write_text(profile_readme, encoding="utf-8")
          PY

          cd profile
          git config user.name "Timeline Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "Profile README is already up to date."
            exit 0
          fi

          git add README.md
          git commit -m "🌌 Sync Timeline Trace"
          git push
