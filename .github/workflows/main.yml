name: 🌌 Yearly Timeline Transmission

on:
  schedule:
    # 00:00 UTC on January 1 every year.
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transmit:
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Receive current timeline
        uses: actions/checkout@v4

      - name: ⏳ Append this year's signal
        shell: bash
        run: |
          set -euo pipefail

          YEAR="$(date -u +%Y)"

          # Idempotency: never write the same year twice.
          if grep -qE "^### .*${YEAR}.*$" README.md; then
            echo "Signal for ${YEAR} already exists. Nothing to transmit."
            exit 0
          fi

          cat >> README.md << EOF

### 🛰️ ${YEAR} — Annual Signal

Another year has passed.

I am still here.
Still watching.
Still wondering what comes next.

**Signal:** \`ONLINE\`  
**Timestamp:** ${YEAR}-01-01  
**Transmission:** #${YEAR}

> *The universe keeps moving. So do I.*

---
EOF

      - name: 💾 Commit transmission
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "No new signal to commit."
            exit 0
          fi

          git config user.name "Timeline Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🌌 Transmit ${YEAR:-$(date -u +%Y)} signal"
          git push
